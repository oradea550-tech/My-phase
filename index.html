<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- منع التكبير والتصغير وتثبيت مقاس الشاشة الطبيعي للهاتف -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta name="theme-color" content="#070b18">

    <title>MyPhase</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================================================
           ROOT VARIABLES
        ========================================================= */
        :root {
            --bg-main: #070b18;
            --bg-card: #111827;
            --bg-card-2: #182235;

            --text-main: #f8fafc;
            --text-muted: #94a3b8;

            --border: #263449;

            --accent-primary: #6366f1;
            --accent-glow: #818cf8;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;

            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        /* =========================================================
           RESET & GLOBALS
        ========================================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 14px; /* تثبيت الحجم المرجعي للخطوط */
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background: var(--bg-main);
        }

        body {
            width: 100vw;
            max-width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(
                circle at top right,
                rgba(99, 102, 241, 0.10),
                transparent 35%
            ), var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 70px;
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%; /* منع المتصفح من تكبير الخطوط تلقائياً */
        }

        button, input, textarea, select {
            font: inherit;
        }

        /* =========================================================
           HEADER
        ========================================================= */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            height: 52px;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent-glow);
        }

        .logo i {
            font-size: 1.1rem;
        }

        .session-timer-badge {
            display: none;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 20px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid var(--accent-primary);
            color: var(--accent-glow);
            font-size: 0.7rem;
            font-weight: 600;
        }

        .user-menu-container {
            position: relative;
            display: none;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-glow));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* =========================================================
           MAIN CONTAINER & CARDS
        ========================================================= */
        main {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 12px;
        }

        .card {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-soft);
        }

        .btn {
            width: 100%;
            height: 40px;
            border-radius: 20px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-glow));
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn.small {
            height: 30px;
            padding: 0 10px;
            font-size: 0.75rem;
            border-radius: 6px;
        }

        /* =========================================================
           BOTTOM NAVIGATION
        ========================================================= */
        .bottom-nav {
            position: fixed;
            left: 0; 
            bottom: 0;
            width: 100%;
            height: 56px;
            z-index: 3000;
            background: rgba(17, 24, 39, 0.98);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-tab {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: var(--text-muted);
            font-size: 0.7rem;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-tab i {
            font-size: 1.1rem;
        }

        .nav-tab.active {
            color: var(--accent-glow);
            font-weight: 600;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-compass"></i>
            <span>MyPhase</span>
        </div>

        <div class="session-timer-badge" id="sessionTimerContainer">
            <i class="fa-regular fa-clock"></i>
            <span id="sessionTimer">02:00:00</span>
        </div>

        <div class="user-menu-container" id="userMenuContainer">
            <div class="user-avatar" id="userAvatarBtn" onclick="toggleDropdown()">
                U
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main>
        <div id="panelFeed" class="tab-panel active">

            <!-- Reminder Banner -->
            <div id="reminderBanner" class="card" style="background:rgba(99,102,241,0.1); border-color:var(--accent-primary); display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="font-size:0.75rem; font-weight:600;" id="reminderText">
                        ⏰ You haven't submitted your update today.
                    </div>
                    <button class="btn small" style="width:auto;" onclick="switchTab('Update')">
                        Update
                    </button>
                </div>
            </div>

            <!-- Welcome Card -->
            <div class="card" id="welcomeCard">
                <div style="display:flex; align-items:center; gap:8px;">
                    <span style="font-size:1.2rem;">👋</span>
                    <div>
                        <h3 id="dashWelcomeName" style="font-size: 1rem; font-weight: 700; color: var(--text-main);">Welcome</h3>
                        <p style="font-size:0.75rem; color:var(--text-muted);" id="dashPhaseSub">
                            Phase Tracker
                        </p>
                    </div>
                </div>

                <div style="margin-top:12px; background:rgba(0,0,0,0.25); padding:10px; border-radius:var(--radius-sm); border:1px solid rgba(255,255,255,0.05);">
                    <div style="font-size:0.65rem; color:var(--accent-glow); font-weight:700; text-transform:uppercase; letter-spacing:0.5px;">
                        Current Phase
                    </div>
                    <div id="dashPhaseName" style="font-size:0.85rem; font-weight:600; margin-top:3px; word-break:break-word;">
                        Active Phase
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <a class="nav-tab active" onclick="switchTab('Feed')">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a class="nav-tab" onclick="switchTab('Update')">
            <i class="fa-solid fa-plus-circle"></i>
            <span>Update</span>
        </a>
        <a class="nav-tab" onclick="switchTab('Journey')">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

</body>
</html>
