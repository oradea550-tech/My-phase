<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPhase App</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            direction: rtl;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            font-size: 1.25rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .container {
            max-width: 600px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background-color: rgba(99, 102, 241, 0.2);
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 32px 16px;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="brand">
            <span>🧭 MyPhase</span>
        </div>
        <div id="sessionTimer" style="font-size: 0.9rem; color: var(--text-muted);">
            ⏱️ Session: <span id="timerText">00:00:00</span>
        </div>
    </div>

    <div class="container">
        <div class="header-actions">
            <h2>👥 أعضاء المجموعة (Support Circle)</h2>
            <button class="btn" onclick="retryMatchCircle(true)">
                🔄 Rematch Circle
            </button>
        </div>

        <div id="circleMembersList">
            <div class="empty-state">
                <p>جاري تحميل أعضاء الدائرة...</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-item">🏠 الصفحة الرئيسية</a>
        <a href="#" class="nav-item active">👥 المجموعة</a>
        <a href="#" class="nav-item">💬 المحادثات</a>
        <a href="#" class="nav-item">👤 الحساب</a>
    </div>

    <script>
        // 1. تهيئة Supabase Client (تأكد من وضع المفاتيح الخاصة بك)
        const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_URL.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let myProfile = null;

        // دالة الهروب من النصوص الخبيثة (XSS Protection)
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // 2. عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', async () => {
            startSessionTimer();
            await initAuth();
        });

        async function initAuth() {
            const { data: { user }, error } = await db.auth.getUser();
            if (error || !user) {
                console.warn("User not authenticated.");
                document.getElementById('circleMembersList').innerHTML = `
                    <div class="empty-state"><p>يرجى تسجيل الدخول لعرض أعضاء مجموعتك.</p></div>
                `;
                return;
            }
            currentUser = user;
            await loadUserProfile();
        }

        async function loadUserProfile() {
            const { data, error } = await db.from('profiles')
                .select('*')
                .eq('user_id', currentUser.id)
                .single();

            if (error) {
                console.error("Error loading profile:", error);
                return;
            }

            myProfile = data;
            
            // إذا لم يكن مرتبطاً بدائرة بعد، تنفيذ المطابقة تلقائياً
            if (!myProfile.circle_id) {
                await retryMatchCircle(false);
            } else {
                await fetchCircleMembers();
            }
        }

        // 3. دالة المطابقة المحدثة لربط الحسابات فوراً
        async function retryMatchCircle(showSuccessAlert = true) {
            if (!myProfile) return;
            try {
                // استدعاء دالة المطابقة من PostgreSQL
                const { error: rpcError } = await db.rpc('match_user_to_circle', {
                    p_user_id: myProfile.user_id,
                    p_phase: myProfile.current_phase,
                    p_country: myProfile.country,
                    p_city: myProfile.city,
                    p_language: 'English'
                });

                if (rpcError) throw rpcError;

                // تحديث بيانات البروفايل المحلية بالـ circle_id الجديد
                const { data: updatedProfile } = await db.from('profiles')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .single();

                if (updatedProfile) {
                    myProfile = updatedProfile;
                }

                // جلب قائمة الأعضاء فوراً
                await fetchCircleMembers();

                if (showSuccessAlert) {
                    alert("تمت المطابقة وتحديث المجموعة بنجاح!");
                }
            } catch (e) {
                console.error("Match circle error:", e);
                alert("حدث خطأ أثناء المطابقة: " + e.message);
            }
        }

        // 4. دالة جلب وعرض كافة أعضاء الدائرة
        async function fetchCircleMembers() {
            const container = document.getElementById('circleMembersList');
            if (!myProfile || !myProfile.circle_id) {
                container.innerHTML = `<div class="empty-state"><p>لم يتم تعيين مجموعة لك بعد. اضغط على Rematch Circle.</p></div>`;
                return;
            }

            const { data, error } = await db.from('profiles')
                .select('*')
                .eq('circle_id', myProfile.circle_id);

            if (error) {
                console.error("Error fetching members:", error);
                container.innerHTML = `<div class="empty-state"><p>حدث خطأ أثناء جلب قائمة الأعضاء.</p></div>`;
                return;
            }

            if (data && data.length > 0) {
                container.innerHTML = data.map(m => `
                    <div class="card">
                        <div>
                            <div style="font-weight: 700; font-size: 1rem;">
                                ${escapeHTML(m.first_name || 'عضو')} ${m.user_id === currentUser.id ? '<span style="color:var(--accent-color); font-size:0.8rem;">(أنت)</span>' : ''}
                            </div>
                            <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">
                                ${escapeHTML(m.current_phase || 'غير محدد')}
                            </div>
                        </div>
                        <span class="badge">${escapeHTML(m.city || 'محلي')}</span>
                    </div>
                `).join('');
            } else {
                container.innerHTML = `<div class="empty-state"><p>لا يوجد أعضاء آخرين في هذه المجموعة حالياً.</p></div>`;
            }
        }

        // 5. عداد الجلسة
        function startSessionTimer() {
            let seconds = 0;
            const timerElement = document.getElementById('timerText');
            setInterval(() => {
                seconds++;
                const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
                const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
                const secs = String(seconds % 60).padStart(2, '0');
                timerElement.textContent = `${hrs}:${mins}:${secs}`;
            }, 1000);
        }
    </script>
</body>
</html>
