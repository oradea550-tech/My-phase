<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- منع المتصفح من التكبير الإجباري وتحديد عرض ثابت مرن للموبايل -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta name="theme-color" content="#070b18">

    <title>MyPhase</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================================================
           GLOBAL VARIABLES & RESET
        ========================================================= */
        :root {
            --bg-main: #070b18;
            --bg-card: #111827;
            --bg-card-2: #182235;

            --text-main: #f8fafc;
            --text-muted: #94a3b8;

            --border: #263449;

            --accent-primary: #6366f1;
            --accent-glow: #818cf8;

            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 18px;

            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.35);
        }

        /* إلغاء أي تكبير إجباري من المتصفح للنصوص */
        html {
            -webkit-text-size-adjust: 100% !important;
            text-size-adjust: 100% !important;
            font-size: 14px !important;
            width: 100%;
            height: 100%;
            background: var(--bg-main);
        }

        *, *::before, *::after {
            box-sizing: border-box !important;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100% !important;
            max-width: 100vw !important;
            min-height: 100vh;
            overflow-x: hidden !important;
            background: radial-gradient(
                circle at top right,
                rgba(99, 102, 241, 0.12),
                transparent 40%
            ), var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 70px;
            -webkit-font-smoothing: antialiased;
        }

        button, input, textarea, select {
            font: inherit;
        }

        /* =========================================================
           FATAL ERROR SCREEN
        ========================================================= */
        #fatalError {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            padding: 16px;
            background: var(--bg-main);
            color: white;
            align-items: center;
            justify-content: center;
        }

        #fatalErrorBox {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            border: 1px solid #334155;
            border-radius: var(--radius-md);
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        #fatalErrorBox h2 {
            color: #f87171;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        #fatalErrorBox p {
            color: #cbd5e1;
            line-height: 1.5;
            font-size: 0.8rem;
            word-break: break-word;
        }

        /* =========================================================
           HEADER
        ========================================================= */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            height: 50px;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 1rem;
            color: var(--accent-glow);
            white-space: nowrap;
        }

        .logo i {
            font-size: 1rem;
        }

        .session-timer-badge {
            display: none;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 20px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid var(--accent-primary);
            color: var(--accent-glow);
            font-size: 0.68rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .user-menu-container {
            position: relative;
            display: none;
        }

        .user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-glow));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .dropdown-menu {
            position: absolute;
            right: 0;
            top: 38px;
            width: 160px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-soft);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 2000;
        }

        .dropdown-menu.show {
            display: flex;
        }

        .dropdown-item {
            width: 100%;
            padding: 8px 12px;
            color: var(--text-main);
            font-size: 0.75rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: transparent;
            border: none;
            text-align: left;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent-glow);
        }

        /* =========================================================
           MAIN CONTAINER & CARDS
        ========================================================= */
        main {
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            padding: 12px;
        }

        .card {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-soft);
            overflow: hidden;
        }

        .btn {
            width: 100%;
            height: 38px;
            border-radius: 20px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-glow));
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 0.82rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn.small {
            height: 28px;
            padding: 0 10px;
            font-size: 0.7rem;
            border-radius: 6px;
        }

        /* =========================================================
           BOTTOM NAVIGATION
        ========================================================= */
        .bottom-nav {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 54px;
            z-index: 3000;
            background: rgba(17, 24, 39, 0.98);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-tab {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: var(--text-muted);
            font-size: 0.65rem;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-tab i {
            font-size: 1rem;
        }

        .nav-tab.active {
            color: var(--accent-glow);
            font-weight: 600;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- FATAL ERROR SCREEN -->
    <div id="fatalError">
        <div id="fatalErrorBox">
            <h2>
                <i class="fa-solid fa-triangle-exclamation"></i>
                MyPhase Error
            </h2>
            <p id="fatalErrorMessage">
                Something went wrong while loading MyPhase.
            </p>
            <button class="btn" style="margin-top:12px;" onclick="location.reload()">
                Reload App
            </button>
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-compass"></i>
            <span>MyPhase</span>
        </div>

        <div class="session-timer-badge" id="sessionTimerContainer">
            <i class="fa-regular fa-clock"></i>
            <span>Session:</span>
            <span id="sessionTimer">02:00:00</span>
        </div>

        <div class="user-menu-container" id="userMenuContainer">
            <div class="user-avatar" id="userAvatarBtn" onclick="toggleDropdown()">
                U
            </div>
            <div class="dropdown-menu" id="dropdownMenu">
                <button class="dropdown-item" onclick="switchTab('Journey'); toggleDropdown();">
                    <i class="fa-solid fa-user"></i>
                    Profile & Journey
                </button>
                <button class="dropdown-item" style="color:#ef4444;" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Sign Out
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN BODY -->
    <main>
        <div id="panelFeed" class="tab-panel active">

            <!-- Reminder Banner -->
            <div id="reminderBanner" class="card" style="background:rgba(99,102,241,0.1); border-color:var(--accent-primary); display:none; padding:10px;">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
                    <div style="font-size:0.72rem; font-weight:600;" id="reminderText">
                        ⏰ You haven't submitted your update today.
                    </div>
                    <button class="btn small" style="width:auto; flex-shrink:0;" onclick="switchTab('Update')">
                        Update
                    </button>
                </div>
            </div>

            <!-- Welcome Card -->
            <div class="card" id="welcomeCard">
                <div style="display:flex; align-items:center; gap:10px;">
                    <span style="font-size:1.3rem;">👋</span>
                    <div style="min-width: 0; flex: 1;">
                        <h3 id="dashWelcomeName" style="font-size:0.95rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                            Welcome
                        </h3>
                        <p style="font-size:0.72rem; color:var(--text-muted);" id="dashPhaseSub">
                            Phase Tracker
                        </p>
                    </div>
                </div>

                <div style="margin-top:12px; background:rgba(0,0,0,0.25); padding:10px; border-radius:var(--radius-sm); border:1px solid rgba(255,255,255,0.05);">
                    <div style="font-size:0.62rem; color:var(--accent-glow); font-weight:700; text-transform:uppercase; letter-spacing:0.5px;">
                        Current Phase
                    </div>
                    <div id="dashPhaseName" style="font-size:0.82rem; font-weight:600; margin-top:2px; word-break:break-word;">
                        Active Phase
                    </div>
                </div>
            </div>

        </div>

        <!-- TAB PANELS (Placeholder for Javascript routing) -->
        <div id="panelUpdate" class="tab-panel"></div>
        <div id="panelJourney" class="tab-panel"></div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <a class="nav-tab active" onclick="switchTab('Feed')">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a class="nav-tab" onclick="switchTab('Update')">
            <i class="fa-solid fa-plus-circle"></i>
            <span>Update</span>
        </a>
        <a class="nav-tab" onclick="switchTab('Journey')">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <script>
        // Simple Dropdown Toggle
        function toggleDropdown() {
            const dropdown = document.getElementById('dropdownMenu');
            if(dropdown) {
                dropdown.classList.toggle('show');
            }
        }

        // Simple Tab Switcher Placeholder
        function switchTab(tabName) {
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));

            const targetPanel = document.getElementById('panel' + tabName);
            if (targetPanel) targetPanel.classList.add('active');

            // Find clicked nav item & highlight
            const activeNav = Array.from(document.querySelectorAll('.nav-tab')).find(el => el.textContent.trim().includes(tabName === 'Feed' ? 'Home' : tabName));
            if (activeNav) activeNav.classList.add('active');
        }
    </script>
</body>
</html>
