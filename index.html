<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#070b18">

    <title>MyPhase</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================================================
           ROOT VARIABLES
        ========================================================= */
        :root {
            --bg-main: #070b18;
            --bg-card: #111827;
            --bg-card-2: #182235;

            --text-main: #f8fafc;
            --text-muted: #94a3b8;

            --border: #263449;

            --accent-primary: #6366f1;
            --accent-glow: #818cf8;

            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;

            --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.28);
        }

        /* =========================================================
           RESET & GLOBALS
        ========================================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            background: var(--bg-main);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            padding-bottom: 75px;
            background: radial-gradient(
                circle at top right,
                rgba(99, 102, 241, 0.10),
                transparent 35%
            ), var(--bg-main);
        }

        button, input, textarea, select {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================================================
           FATAL ERROR SCREEN
        ========================================================= */
        #fatalError {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            padding: 20px;
            background: #070b18;
            color: white;
            align-items: center;
            justify-content: center;
        }

        #fatalErrorBox {
            width: 100%;
            max-width: 480px;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        #fatalErrorBox h2 {
            color: #f87171;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        #fatalErrorBox p {
            color: #cbd5e1;
            line-height: 1.6;
            font-size: 0.85rem;
            word-break: break-word;
        }

        /* =========================================================
           HEADER
        ========================================================= */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            background: rgba(17, 24, 39, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1rem;
            color: var(--accent-glow);
            white-space: nowrap;
        }

        .session-timer-badge {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(99, 102, 241, 0.14);
            border: 1px solid var(--accent-primary);
            color: var(--accent-glow);
            font-size: 0.65rem;
            font-weight: 700;
            white-space: nowrap;
        }

        /* =========================================================
           USER MENU
        ========================================================= */
        .user-menu-container {
            position: relative;
            display: none;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-glow));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            border: 2px solid var(--border);
        }

        .dropdown-menu {
            position: absolute;
            right: 0;
            top: 40px;
            width: 170px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-soft);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 2000;
        }

        .dropdown-menu.show {
            display: flex;
        }

        .dropdown-item {
            width: 100%;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 0.8rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: transparent;
            border: none;
            text-align: left;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent-glow);
        }

        /* =========================================================
           MAIN & CARDS
        ========================================================= */
        main {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
        }

        .card {
            width: 100%;
            background: linear-gradient(180deg, rgba(17, 24, 39, 0.98), rgba(15, 23, 42, 0.98));
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-soft);
            overflow: hidden;
        }

        .btn {
            width: 100%;
            min-height: 42px;
            padding: 10px 14px;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-glow));
            color: white;
            font-weight: 700;
            border: none;
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.2s ease;
        }

        .btn.small {
            min-height: 32px;
            padding: 6px 10px;
            font-size: 0.72rem;
            border-radius: var(--radius-sm);
        }

        /* =========================================================
           NAVIGATION
        ========================================================= */
        .bottom-nav {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            z-index: 3000;
            width: 100%;
            background: rgba(17, 24, 39, 0.97);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 6px 0;
            padding-bottom: calc(6px + env(safe-area-inset-bottom));
        }

        .nav-tab {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: var(--text-muted);
            font-size: 0.65rem;
            text-decoration: none;
            cursor: pointer;
            padding: 2px 0;
        }

        .nav-tab i {
            font-size: 0.95rem;
        }

        .nav-tab.active {
            color: var(--accent-glow);
            font-weight: 700;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        /* =========================================================
           RESPONSIVE FIXES
        ========================================================= */
        @media (max-width: 480px) {
            header {
                padding: 10px;
            }
            .logo {
                font-size: 0.95rem;
            }
            h3 {
                font-size: 0.95rem;
            }
            main {
                padding: 10px;
            }
            .card {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- FATAL ERROR SCREEN -->
    <div id="fatalError">
        <div id="fatalErrorBox">
            <h2>
                <i class="fa-solid fa-triangle-exclamation"></i>
                MyPhase Error
            </h2>
            <p id="fatalErrorMessage">
                Something went wrong while loading MyPhase.
            </p>
            <button class="btn" style="margin-top:14px;" onclick="location.reload()">
                Reload App
            </button>
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-compass"></i>
            <span>MyPhase</span>
        </div>

        <div class="session-timer-badge" id="sessionTimerContainer">
            <i class="fa-regular fa-clock"></i>
            <span>Session:</span>
            <span id="sessionTimer">02:00:00</span>
        </div>

        <div class="user-menu-container" id="userMenuContainer">
            <div class="user-avatar" id="userAvatarBtn" onclick="toggleDropdown()">
                U
            </div>
            <div class="dropdown-menu" id="dropdownMenu">
                <button class="dropdown-item" onclick="switchTab('Journey'); toggleDropdown();">
                    <i class="fa-solid fa-user"></i>
                    Profile & Journey
                </button>
                <button class="dropdown-item" style="color:#ef4444;" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Sign Out
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main>
        <div id="panelFeed" class="tab-panel active">

            <!-- Reminder Banner -->
            <div id="reminderBanner" class="card" style="background:rgba(99,102,241,0.10); border-color:var(--accent-primary); display:none; padding:10px 12px;">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                    <div style="font-size:0.75rem; font-weight:600;" id="reminderText">
                        ⏰ You haven't submitted your update today.
                    </div>
                    <button class="btn small" style="width:auto; flex-shrink:0;" onclick="switchTab('Update')">
                        Update
                    </button>
                </div>
            </div>

            <!-- Welcome Card -->
            <div class="card" id="welcomeCard">
                <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
                    <div>
                        <h3 id="dashWelcomeName" style="font-size: 1rem; font-weight: 700;">👋 Welcome</h3>
                        <p style="font-size:0.75rem; color:var(--text-muted); margin-top:2px;" id="dashPhaseSub">
                            Phase Tracker
                        </p>
                    </div>
                </div>

                <div style="margin-top:12px; background:rgba(0,0,0,0.20); padding:10px 12px; border-radius:var(--radius-sm); border:1px solid rgba(255,255,255,0.03);">
                    <div style="font-size:0.68rem; color:var(--accent-glow); font-weight:700; text-transform:uppercase;">
                        Current Phase
                    </div>
                    <div id="dashPhaseName" style="font-size:0.9rem; font-weight:700; margin-top:2px; word-break:break-word;">
                        Active Phase
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <a class="nav-tab active" onclick="switchTab('Feed')">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a class="nav-tab" onclick="switchTab('Update')">
            <i class="fa-solid fa-plus-circle"></i>
            <span>Update</span>
        </a>
        <a class="nav-tab" onclick="switchTab('Journey')">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

</body>
</html>
